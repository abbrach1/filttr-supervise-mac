[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "filttr-supervise"
version = "0.1.4"
description = "Filttr USB iPhone supervision tool"
requires-python = ">=3.10"
dependencies = [
  "pymobiledevice3>=11.0.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pyinstaller>=6.0.0"]

[project.scripts]
filttr-supervise = "filttr_supervise.__main__:main"

[tool.setuptools.packages.find]
include = ["filttr_supervise*"]

[tool.pytest.ini_options]
pythonpath = ["."]
